name: UI Tests & Allure Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and install Gradle 9.6.0
        run: |
          set -euo pipefail

          GRADLE_ZIP="$RUNNER_TEMP/gradle-9.6.0-bin.zip"
          GRADLE_DIR="$RUNNER_TEMP/gradle-9.6.0"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://mirrors.huaweicloud.com/gradle/gradle-9.6.0-bin.zip" \
            --output "$GRADLE_ZIP"

          echo "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01  $GRADLE_ZIP" \
            | sha256sum --check

          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      - name: Check Gradle installation
        run: gradle --version

      - name: Download Allure history from gh-pages
        continue-on-error: true
        run: |
          git clone --depth 1 --single-branch --branch gh-pages \
            "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages-branch || true

          if [ -d "gh-pages-branch/history" ]; then
            mkdir -p build/allure-results/history
            cp -R gh-pages-branch/history/. build/allure-results/history/
          fi

      - name: Start Selenoid
        uses: Xotabu4/selenoid-github-action@v2

      - name: Run tests
        id: tests
        continue-on-error: true
        run: gradle test --no-daemon -Dselenide.remote=http://localhost:4444/wd/hub

      - name: Generate Allure Report
        if: always()
        run: gradle allureReport --no-daemon

      - name: Deploy Allure Report to GitHub Pages
        if: always() && hashFiles('build/reports/allure-report/allureReport/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/reports/allure-report/allureReport
          publish_branch: gh-pages

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1