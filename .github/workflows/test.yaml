name: UI Tests & Allure Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Свежий чекаут с патчами безопасности:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Актуальный сетап Java (версии 1-4 задепрекейчены, используем v6):
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      # Официальный экшен кеширования Gradle (тот самый со скриншота!)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # Подтягиваем историю прошлых билдов для графиков трендов Allure
      - name: Download Allure history from gh-pages
        continue-on-error: true
        run: |
          git clone --single-branch --branch gh-pages https://github.com/${{ github.repository }} gh-pages-branch || true
          if [ -d "gh-pages-branch/history" ]; then
            mkdir -p build/allure-results/history
            cp -r gh-pages-branch/history/* build/allure-results/history/ || true
          fi

      # Прогоняем тесты (continue-on-error нужен, чтобы упавший ассерт не срубил сборку до генерации отчета)
      - name: Run tests
        run: ./gradlew test
        continue-on-error: true

      # Собираем статичный HTML Allure Report
      - name: Generate Allure Report
        run: ./gradlew allureReport

      # Публикуем отчет в ветку gh-pages (GitHub Pages)
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/reports/allure-report
          publish_branch: gh-pages