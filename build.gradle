plugins {
    id 'java-library'
    id("io.qameta.allure") version "4.3.0"

}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.18.2",
            "org.junit.jupiter:junit-jupiter:5.10.2",
            "net.datafaker:datafaker:2.7.0",
            "io.qameta.allure:allure-selenide:2.35.5",
            "io.qameta.allure:allure-junit5:2.35.5")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
allure {
    version = "2.29.0" // Версия генератора отчетов Allure
}
def selenideRemote = System.getProperty('selenide.remote')
test {
    useJUnitPlatform()
    if (selenideRemote != null) {
        systemProperty 'selenide.remote', selenideRemote
    }
    outputs.upToDateWhen { false }
}
tasks.register("simple_test", Test){
    useJUnitPlatform{
        includeTags("simple")
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}
