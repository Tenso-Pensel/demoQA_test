plugins {
    id 'java-library'
    id("io.qameta.allure") version "4.3.0"
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.18.2",
            "org.junit.jupiter:junit-jupiter:5.10.2",
            "net.datafaker:datafaker:2.7.0",
            "io.qameta.allure:allure-selenide:2.35.5",
            "io.qameta.allure:allure-junit5:2.35.5"
    )
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

allure {
    version = "2.29.0" // Версия генератора отчетов Allure
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Общая настройка сразу для ВСЕХ тестовых задач (и для стандартной test, и для simple_test)
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperties(System.getProperties() as Map<String, ?>) // Пробрасывает любые -D параметры из консоли/Jenkins
    outputs.upToDateWhen { false } // Чтобы тесты запускались всегда, даже если код не менялся

    // Подробный вывод хода выполнения тестов в консоль (очень удобно для Jenkins)
    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}

// Кастомная задача для запуска только тестов с тегом @Tag("simple")
def taggedTestTasks = [
        simple_test      : 'simple',
        one_property_test: 'one_property',
        negativeTest     :  'negative',
        positiveTest     :  'positive'
]

taggedTestTasks.each { taskName, tag ->
    tasks.register(taskName, Test) {
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath

        useJUnitPlatform {
            includeTags(tag)
        }
    }
}
